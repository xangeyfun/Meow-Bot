<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="meow bot">
  <rect width="1200" height="630" fill="#f6f1e7"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1c1a17" stroke-width="4"/>
  <defs>
    <clipPath id="pfp-clip">
      <rect x="96" y="158" width="288" height="288" rx="48"/>
    </clipPath>
  </defs>
  <image href="pfp.jpg" x="96" y="158" width="288" height="288" preserveAspectRatio="xMidYMid slice" clip-path="url(#pfp-clip)"/>
  <rect x="96" y="158" width="288" height="288" rx="48" fill="none" stroke="#1c1a17" stroke-width="4"/>
  <text x="430" y="285" font-family="monospace" font-size="104" font-weight="700" fill="#1c1a17">meow bot</text>
