<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ bot_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}a small discord bot that says meow.{% endblock %}">
  <link rel="canonical" href="{{ site_url }}{{ request.path }}">
  <meta property="og:title" content="{% block og_title %}{{ bot_name }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}a small discord bot that says meow.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site_url }}{{ request.path }}">
  <meta property="og:image" content="{{ site_url }}/static/img/og.svg">
  <meta name="theme-color" content="#E85D2A">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}" aria-label="{{ bot_name }} home">
      <img src="{{ url_for('static', filename='img/cat.svg') }}" alt="" width="28" height="28">
      <span>{{ bot_name }}</span>
    </a>
    <nav class="site-nav" aria-label="main">
      <a href="{{ url_for('commands_page') }}" {% if page == 'commands' %}aria-current="page"{% endif %}>commands</a>
      <a href="{{ url_for('stats_page') }}" {% if page == 'stats' %}aria-current="page"{% endif %}>stats</a>
      <a href="{{ url_for('status_page') }}" {% if page == 'status' %}aria-current="page"{% endif %}>status</a>
      <a href="{{ url_for('info_page') }}" {% if page == 'info' %}aria-current="page"{% endif %}>info</a>
      <a class="nav-invite" href="{{ invite_url }}">add to discord</a>
    </nav>
  </header>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <img src="{{ url_for('static', filename='img/cat.svg') }}" alt="" width="20" height="20">
      <span>{{ bot_name }} v{{ version }}</span>
    </div>
    <nav class="footer-nav" aria-label="footer">
      <a href="{{ url_for('privacy_page') }}">privacy</a>
      <a href="{{ url_for('terms_page') }}">terms</a>
      <a href="{{ url_for('support_page') }}">support</a>
      <a href="{{ github_url }}">github</a>
    </nav>
    <p class="footer-note">built by xangey. no ads, no nonsense, just meows.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
