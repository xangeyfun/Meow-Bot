<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ bot_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}a discord bot that says meow.{% endblock %}">
  <link rel="canonical" href="{{ site_url }}{{ request.path }}">
  <meta property="og:title" content="{% block og_title %}{{ bot_name }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}a discord bot that says meow.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site_url }}{{ request.path }}">
  <meta property="og:image" content="{{ site_url }}/static/img/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="meow bot profile picture with the text say meow, receive meow.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ site_url }}/static/img/og.png">
  <meta name="theme-color" content="#E8682F">
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/pfp.jpg') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-page="{{ page }}">
  <div class="cursor-trail" data-cursor-trail aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}" aria-label="{{ bot_name }} home">
      <span class="brand-mark">
        <img src="{{ url_for('static', filename='img/pfp.jpg') }}" alt="" width="32" height="32">
        <span class="brand-ear brand-ear-left" aria-hidden="true"></span>
        <span class="brand-ear brand-ear-right" aria-hidden="true"></span>
      </span>
      <span class="brand-name">{{ bot_name }}</span>
    </a>
    <nav class="site-nav" aria-label="main">
      <div class="site-links">
        <a href="{{ url_for('commands_page') }}" {% if page == 'commands' %}aria-current="page"{% endif %}>commands</a>
        <a href="{{ url_for('stats_page') }}" {% if page == 'stats' %}aria-current="page"{% endif %}>stats</a>
        <a href="{{ url_for('vote_page') }}" {% if page == 'vote' %}aria-current="page"{% endif %}>vote</a>
        <a href="{{ url_for('status_page') }}" {% if page == 'status' %}aria-current="page"{% endif %}>status</a>
        <a href="{{ url_for('info_page') }}" {% if page == 'info' %}aria-current="page"{% endif %}>info</a>
      </div>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="switch to dark mode" title="switch theme">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"></path>
        </svg>
      </button>
      <a class="nav-invite" href="{{ invite_url }}">add to discord</a>
    </nav>
  </header>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <img src="{{ url_for('static', filename='img/pfp.jpg') }}" alt="" width="22" height="22">
      <span>{{ bot_name }}</span>
    </div>
    <div class="footer-cat" aria-hidden="true">
      <span class="footer-cat-glyph">ᓚᘏᗢ</span>
      <span class="footer-zzz"><span>z</span><span>z</span><span>z</span></span>
    </div>
    <nav class="footer-nav" aria-label="footer">
      <a href="{{ url_for('docs_page') }}">docs</a>
      <a href="{{ url_for('privacy_page') }}">privacy</a>
      <a href="{{ url_for('terms_page') }}">terms</a>
      <a href="{{ url_for('support_page') }}">support</a>
      <a href="{{ github_url }}">github</a>
    </nav>
  </footer>

  <button class="back-to-top" type="button" data-back-to-top aria-label="back to top" title="back to top">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 19V5M6 11l6-6 6 6"></path>
    </svg>
    <span>top</span>
  </button>

  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
